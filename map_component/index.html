<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font:14px system-ui;color:#17243a}button{min-height:44px;border:1px solid #ccd5e2;background:#e8efff;color:#165bd7;border-radius:12px;padding:8px 14px;cursor:pointer}#tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}button[aria-pressed="true"]{background:#165bd7;color:white;border-color:#165bd7}#viewport{height:420px;overflow:hidden;background:#e8edf4;border-radius:22px;touch-action:none;position:relative}#stage{position:absolute;transform-origin:0 0;overflow:hidden}#image{position:absolute;display:block;max-width:none;transform-origin:0 0;pointer-events:none;user-select:none}#markers{position:absolute;inset:0}.marker{position:absolute;box-sizing:border-box;width:max-content;max-width:160px;height:auto;min-height:24px;min-width:24px;padding:2px 6px;white-space:normal;overflow-wrap:anywhere;transform:translate(-50%,-50%) scale(var(--marker-scale,1));transform-origin:center;border:2px solid white;border-radius:8px;color:white;font-size:10px;line-height:16px;font-weight:bold}.marker::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:transparent}#choices{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}button:focus-visible{outline:3px solid #165bd7;outline-offset:2px}#mode{line-height:1.5}@media(max-width:500px){#viewport{height:360px}}

.selection-pin{position:absolute;width:22px;height:22px;box-sizing:border-box;border:3px solid #fff;border-radius:50%;background:#ff8a00;box-shadow:0 0 0 2px #9a4700;transform:translate(-50%,-50%) scale(var(--marker-scale,1));transform-origin:center;pointer-events:none;z-index:20}
.selection-pin::before{content:'+';position:absolute;inset:0;text-align:center;font:bold 17px/16px system-ui;color:#fff}
.selection-pin::after{content:'선택 위치 · 저장 전';position:absolute;left:50%;bottom:29px;transform:translateX(-50%);white-space:nowrap;padding:4px 7px;border-radius:6px;background:#9a4700;color:#fff;font:12px/16px system-ui}
#selected-info{font-size:12px;color:#8a4000;line-height:1.5;margin:6px 0}
.marker.is-selected{outline:3px solid #165bd7;outline-offset:3px;z-index:10;box-shadow:0 0 0 6px rgba(22,91,215,.18)}
</style></head><body>
<div id="tools"><button id="landscape" aria-pressed="true">가로</button><button id="portrait" aria-pressed="false">세로</button><button id="plus" aria-label="지도 확대">+</button><button id="minus" aria-label="지도 축소">-</button><button id="original" aria-pressed="false">원본 전체</button><button id="fit">전체보기</button></div>
<p id="mode"></p><div id="viewport"><div id="stage"><img id="image" alt="공장 도면" draggable="false"><div id="markers"></div></div></div><div id="choices"></div><p id="selected-info" role="status" aria-live="polite"></p>
<script>
'use strict';
let args={markers:[],edit:false},scale=1,tx=0,ty=0,drag=null,orientation='landscape',rotated=false,baseW=0,baseH=0;
const $=id=>document.getElementById(id);
let trimMargins=true;
let selectedPosition=null;
// Bounds of the existing 1404 x 1985 layout; retain four pixels around the drawing.
const drawingBounds={x0:308/1404,x1:1095/1404,y0:0,y1:1};
let crop={x0:0,x1:1,y0:0,y1:1};
// Preserve the user's choice across component remounts when browser storage is available.
try{const saved=sessionStorage.getItem('rollingSafetyMapOrientation');if(saved==='portrait'||saved==='landscape')orientation=saved;}catch(_){}
function send(type,more={}){parent.postMessage({isStreamlitMessage:true,type,...more},'*');}
function value(data){send('streamlit:setComponentValue',{value:{...data,nonce:Date.now().toString(36)+Math.random().toString(36).slice(2)},dataType:'json'});}
function frame(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+10});}
function transform(){$('stage').style.setProperty('--marker-scale',String(1/scale));$('stage').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
// Coordinates stored by Python always refer to the original, unrotated image.
function displayPoint(x,y){const u=(x-crop.x0)/(crop.x1-crop.x0),v=(y-crop.y0)/(crop.y1-crop.y0);return rotated?{x:v,y:1-u}:{x:u,y:v};}
function originalPoint(x,y){const u=rotated?1-y:x,v=rotated?x:y;return {x:crop.x0+u*(crop.x1-crop.x0),y:crop.y0+v*(crop.y1-crop.y0)};}
function updateButtons(){$('landscape').setAttribute('aria-pressed',String(orientation==='landscape'));$('portrait').setAttribute('aria-pressed',String(orientation==='portrait'));}
function fit(){
 const image=$('image'),iw=image.naturalWidth,ih=image.naturalHeight;if(!iw||!ih)return;
 crop=trimMargins?{...drawingBounds}:{x0:0,x1:1,y0:0,y1:1};
 const cw=iw*(crop.x1-crop.x0),ch=ih*(crop.y1-crop.y0);
 rotated=orientation==='landscape'?ch>cw:cw>ch;
 const dw=rotated?ch:cw,dh=rotated?cw:ch;
 const w=$('viewport').clientWidth;
 $('viewport').style.height=Math.max(160,Math.min(600,w*dh/dw))+'px';
 const h=$('viewport').clientHeight;
 const factor=Math.min(w/dw,h/dh);
 baseW=dw*factor;baseH=dh*factor;
 $('stage').style.width=baseW+'px';$('stage').style.height=baseH+'px';
 image.style.width=iw*factor+'px';image.style.height=ih*factor+'px';
 image.style.transform=rotated?`translate(${-ih*crop.y0*factor}px,${iw*crop.x1*factor}px) rotate(270deg)`:`translate(${-iw*crop.x0*factor}px,${-ih*crop.y0*factor}px)`;
 $('original').setAttribute('aria-pressed',String(!trimMargins));
 $('original').textContent=trimMargins?'원본 전체':'여백 숨기';
 scale=1;tx=(w-baseW)/2;ty=(h-baseH)/2;drag=null;
 $('choices').replaceChildren();updateButtons();renderMarkers();transform();frame();
}
function chooseOrientation(next){orientation=next;try{sessionStorage.setItem('rollingSafetyMapOrientation',next);}catch(_){}fit();}
function commitSelection(e){
 args.selected_id=e.id;
 for(const b of $('markers').querySelectorAll('.marker')){
  const active=b.dataset.equipmentId===String(e.id);
  b.classList.toggle('is-selected',active);b.setAttribute('aria-pressed',String(active));
 }
 value({event:'select',id:e.id});
}
function select(e){
 const p=displayPoint(e.x,e.y);
 const near=(args.markers||[]).filter(m=>{const q=displayPoint(m.x,m.y);return Math.hypot((q.x-p.x)*baseW*scale,(q.y-p.y)*baseH*scale)<44;});
 $('choices').replaceChildren();
 commitSelection(e);if(near.length<2){frame();return;}
 for(const m of near){const b=document.createElement('button');b.textContent=m.code+' / '+m.name;b.onclick=()=>commitSelection(m);$('choices').append(b);}frame();
}
function renderSelection(){
 const old=$('selection-pin');if(old)old.remove();
 const info=$('selected-info');
 if(!args.edit||!selectedPosition){info.textContent='';return;}
 const p=displayPoint(selectedPosition.x,selectedPosition.y),pin=document.createElement('div');
 pin.id='selection-pin';pin.className='selection-pin';pin.style.left=p.x*100+'%';pin.style.top=p.y*100+'%';
 pin.setAttribute('aria-label','선택 위치');$('markers').append(pin);
 info.textContent='선택 위치: X '+selectedPosition.x.toFixed(3)+' / Y '+selectedPosition.y.toFixed(3)+' · 위치만 선택한 상태입니다. 설비 저장을 눌러야 반영됩니다.';
}
function renderMarkers(){
 $('markers').replaceChildren();
 for(const e of args.markers||[]){
  if(!Number.isFinite(e.x)||!Number.isFinite(e.y))continue;
  const p=displayPoint(e.x,e.y),b=document.createElement('button');
  b.className='marker';b.dataset.equipmentId=String(e.id);b.classList.toggle('is-selected',!args.edit&&args.selected_id===e.id);b.setAttribute('aria-pressed',String(!args.edit&&args.selected_id===e.id));b.style.left=p.x*100+'%';b.style.top=p.y*100+'%';
  b.style.background={uninspected:'#6b7280',incomplete:'#d32f2f',complete:'#2e7d32'}[e.status]||'#6b7280';
  b.textContent=String(e.code??'');
  b.title=e.code+' / '+e.name;b.setAttribute('aria-label',b.title);
  b.onclick=ev=>{if(!args.edit){ev.stopPropagation();select(e);}};$('markers').append(b);
 }
 renderSelection();
}
function render(){
 const src='data:image/png;base64,'+args.image;
 $('mode').textContent=args.edit?'위치 지정: 확인한 위치를 터치하세요.':'마커 또는 아래 설비 목록에서 선택하세요.';
 if($('image').getAttribute('src')!==src){selectedPosition=null;$('image').onload=fit;$('image').src=src;}else renderMarkers();
 updateButtons();frame();
}
function zoom(multiplier){
 if(!baseW)return;
 const w=$('viewport').clientWidth,h=$('viewport').clientHeight,next=Math.max(.5,Math.min(8,scale*multiplier));
 const ratio=next/scale;tx=w/2-(w/2-tx)*ratio;ty=h/2-(h/2-ty)*ratio;scale=next;transform();
}
$('landscape').onclick=()=>chooseOrientation('landscape');$('portrait').onclick=()=>chooseOrientation('portrait');
$('original').onclick=()=>{trimMargins=!trimMargins;fit();};
$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(1/1.25);$('fit').onclick=fit;
$('viewport').onpointerdown=e=>{
 if(!baseW||!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;
 if(e.target.closest('button')&&!args.edit)return;
 drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty,moved:false};$('viewport').setPointerCapture(e.pointerId);
};
$('viewport').onpointermove=e=>{
 if(!drag||e.pointerId!==drag.id)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(Math.hypot(dx,dy)>6)drag.moved=true;
 if(drag.moved){tx=drag.tx+dx;ty=drag.ty+dy;transform();}
};
$('viewport').onpointerup=e=>{
 if(!drag||e.pointerId!==drag.id)return;
 const moved=drag.moved||Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6;drag=null;
 if($('viewport').hasPointerCapture(e.pointerId))$('viewport').releasePointerCapture(e.pointerId);
 if(args.edit&&!moved){
  const r=$('stage').getBoundingClientRect(),dx=(e.clientX-r.left)/r.width,dy=(e.clientY-r.top)/r.height;
  if(dx>=0&&dx<=1&&dy>=0&&dy<=1){const p=originalPoint(dx,dy);selectedPosition={x:p.x,y:p.y};renderSelection();frame();value({event:'position',x:p.x,y:p.y});}
 }
};
$('viewport').onpointercancel=()=>drag=null;$('viewport').onlostpointercapture=()=>drag=null;
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args||{};if(!args.edit)selectedPosition=null;render();});
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(frame).observe(document.body);
updateButtons();send('streamlit:componentReady',{apiVersion:1});frame();
</script></body></html>
