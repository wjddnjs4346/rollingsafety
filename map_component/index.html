<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{margin:0;font:14px system-ui}button{min-height:44px;border:1px solid #ccd5e2;background:#e8efff;color:#165bd7;border-radius:12px;padding:8px 14px;cursor:pointer}#tools{display:flex;gap:8px;margin:8px 0}#viewport{height:420px;overflow:hidden;background:#e8edf4;border-radius:22px;touch-action:none;position:relative}#stage{position:absolute;transform-origin:0 0}img{width:100%;display:block;pointer-events:none;user-select:none}.marker{position:absolute;width:44px;height:44px;padding:0;transform:translate(-50%,-50%);border:3px solid white;border-radius:50%;color:white;font-weight:bold}#choices{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}button:focus-visible{outline:3px solid #165bd7}@media(max-width:500px){#viewport{height:360px}}</style><div id="tools"><button id="plus" aria-label="지도 확대">+</button><button id="minus" aria-label="지도 축소">-</button><button id="fit">전체보기</button></div><p id="mode"></p><div id="viewport"><div id="stage"><img id="image" alt="공장 도면"><div id="markers"></div></div></div><div id="choices"></div><script>
let args={},scale=1,tx=0,ty=0,drag=null;const $=id=>document.getElementById(id);
function send(type,more={}){parent.postMessage({isStreamlitMessage:true,type,...more},'*');}function value(data){send('streamlit:setComponentValue',{value:{...data,nonce:Date.now().toString(36)+Math.random().toString(36).slice(2)},dataType:'json'});}function frame(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+10});}function transform(){$('stage').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}function fit(){if(!$('image').naturalWidth)return;const w=$('viewport').clientWidth,h=$('viewport').clientHeight,ratio=$('image').naturalHeight/$('image').naturalWidth,width=Math.min(w,h/ratio);$('stage').style.width=width+'px';scale=1;tx=(w-width)/2;ty=0;transform();frame();}
function select(e){const r=$('stage').getBoundingClientRect(),near=args.markers.filter(m=>Math.hypot((m.x-e.x)*r.width,(m.y-e.y)*r.height)<44);$('choices').replaceChildren();if(near.length<2){value({event:'select',id:e.id});return;}for(const m of near){const b=document.createElement('button');b.textContent=m.code+' / '+m.name;b.onclick=()=>value({event:'select',id:m.id});$('choices').append(b);}frame();}
function render(){const src='data:image/png;base64,'+args.image;if($('image').src!==src){$('image').onload=fit;$('image').src=src;}$('mode').textContent=args.edit?'위치 지정: 확인한 위치를 터치하세요.':'마커 또는 아래 설비 목록에서 선택하세요.';$('markers').replaceChildren();for(const e of args.markers){const b=document.createElement('button');b.className='marker';b.style.left=e.x*100+'%';b.style.top=e.y*100+'%';b.style.background={uninspected:'#6b7280',incomplete:'#d32f2f',complete:'#2e7d32'}[e.status]||'#6b7280';b.textContent={extinguisher:'E',hydrant:'H',manifold:'M'}[e.type];b.title=e.code+' / '+e.name;b.setAttribute('aria-label',b.title);b.onclick=ev=>{if(!args.edit){ev.stopPropagation();select(e);}};$('markers').append(b);}frame();}
$('plus').onclick=()=>{scale=Math.min(8,scale*1.25);transform();};$('minus').onclick=()=>{scale=Math.max(.5,scale/1.25);transform();};$('fit').onclick=fit;
$('viewport').onpointerdown=e=>{if(e.target.closest('button')&&!args.edit)return;drag={x:e.clientX,y:e.clientY,tx,ty};$('viewport').setPointerCapture(e.pointerId);};$('viewport').onpointermove=e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform();};$('viewport').onpointerup=e=>{if(!drag)return;const moved=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);drag=null;if(args.edit&&moved<6){const r=$('image').getBoundingClientRect(),x=(e.clientX-r.x)/r.width,y=(e.clientY-r.y)/r.height;if(x>=0&&x<=1&&y>=0&&y<=1)value({event:'position',x,y});}};$('viewport').onpointercancel=()=>drag=null;window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;render();});window.addEventListener('resize',fit);send('streamlit:componentReady',{apiVersion:1});frame();
</script></html>
